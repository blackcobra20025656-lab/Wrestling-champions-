name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir project
          unzip -q WrestlingChampions_Android_Project.zip -d project

      - name: Find Android project
        run: |
          GRADLEW=$(find project -name gradlew -type f | head -1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew was not found"
            find project -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "GRADLEW=$GRADLEW" >> $GITHUB_ENV
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wrestling-Champions-APK
          path: project/**/build/outputs/apk/**/*.apk
